# Publishes the internal services' ports on the host, for tests and maintenance (the server test suite, psql, …).
# Usage, in the .env:
#   COMPOSE_FILE=docker-compose.yml:deploy/standalone/ports.yml
#   PUBLISH_ADDRESS=…   # the same as the root ports (init-env.sh sets the loopback); deliberately no default
# Services of disabled profiles do not start: neither do their ports.
services:
  postgres:
    ports: ["${PUBLISH_ADDRESS:?set PUBLISH_ADDRESS in the .env}:${POSTGRES_PORT:-5432}:5432"]
  calibre:
    ports: ["${PUBLISH_ADDRESS:?set PUBLISH_ADDRESS in the .env}:${CALIBRE_PORT:-8807}:8080"]
  jobe-gateway:
    ports: ["${PUBLISH_ADDRESS:?set PUBLISH_ADDRESS in the .env}:${JOBE_PORT:-8804}:80"]
  libretranslate:
    ports: ["${PUBLISH_ADDRESS:?set PUBLISH_ADDRESS in the .env}:${LIBRETRANSLATE_PORT:-8803}:5000"]
  curator:
    ports: ["${PUBLISH_ADDRESS:?set PUBLISH_ADDRESS in the .env}:${CURATOR_PORT:-8085}:8085"]
