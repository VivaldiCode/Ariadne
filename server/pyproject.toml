[project]
name = "ariadne"
version = "0.1.0"
description = "Memória de contexto offline: servidor MCP e API REST sobre a biblioteca Kiwix"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "beautifulsoup4>=4.12",
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.28",
    "libzim>=3.6",
    "markdown-it-py>=3",
    "markdownify>=1.2.3",
    "mcp>=2",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "pyarrow>=18",
    "pydantic-settings>=2.7",
    "pypdf>=6.21.4",
    "pyyaml>=6",
    "sqlalchemy>=2.0.36",
    "tokenizers>=0.21",
    "typer>=0.15",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
# Espelho para o MemPalace (SEMANTIC_STORE=mempalace, `ariadne mempalace sync`). Fica de fora da
# imagem por omissão: o pacote exige o chromadb (binários nativos, não validados sem AVX).
mempalace = ["mempalace[pgvector]>=3.11,<4"]
kaggle = [
    "kaggle>=1.7",
]

[project.scripts]
ariadne = "ariadne.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ariadne"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Texto em português usa travessões e aspas tipográficas.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["ariadne"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# O libzim traz os .pyi mas não o py.typed.
module = ["libzim", "libzim.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
# O mempalace é um extra opcional e importa-se à última hora.
module = ["mempalace", "mempalace.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Com o extra instalado o mypy vê o mempalace, que tem chamadas sem anotações.
module = ["ariadne.mempalace_store"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# O onnxruntime não traz tipos (o embedder trata-o como Any).
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# O pyarrow não traz tipos (só `vectors build/import` o usa, importado à última hora).
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: precisa do Postgres do compose (docker compose up -d postgres)",
    "kiwix: precisa do kiwix-serve do compose e do ZIM de teste (docker compose up -d kiwix)",
    "jobe: precisa do Jobe do compose (docker compose up -d jobe jobe-gateway)",
    "moodle: precisa do Moodle + CodeRunner + Jobe do compose (docker compose up -d moodle jobe-gateway)",
    "calibre: precisa do Calibre do compose (docker compose up -d calibre)",
    "kavita: precisa do Calibre e do Kavita do compose (docker compose up -d calibre kavita)",
    "wikijs: precisa do Wiki.js do compose (marcado sozinho nos testes que usam a fixture `wikijs`)",
    "mempalace: precisa do extra opcional (uv run --extra mempalace pytest -m mempalace)",
    "model: descarrega o modelo ONNX real (118 MB, na 1.ª vez, para server/.cache/models); -m 'not model' salta-o",
]
