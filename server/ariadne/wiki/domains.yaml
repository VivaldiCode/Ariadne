        electricity.
    children:
      - id: energia/solar
        names: {pt: Energia solar, en: Solar energy}
        slugs: {pt: solar, en: solar}
        descriptions:
          pt: >-
            Energia solar: painéis fotovoltaicos, coletores solares térmicos, fornos solares,
            inversores, controladores de carga, baterias, orientação e aquecimento de água.
          en: >-
