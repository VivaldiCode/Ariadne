      en: >-
        Construction and housing: building, insulating and maintaining a home, with materials,
        techniques and household repairs.
    children:
      - id: construcao/materiais
        names: {pt: Materiais de construção, en: Building materials}
        slugs: {pt: materiais, en: materials}
        descriptions:
          pt: >-
            Materiais de construção: madeira, tijolo, adobe, taipa, pedra, betão, cimento,
            argamassa, cal, bambu, telhas, vidro, aço e materiais naturais ou reciclados.
          en: >-
            Building materials: timber, brick, adobe, rammed earth, stone, concrete, cement,
            mortar, lime, bamboo, roof tiles, glass, steel and natural or recycled materials.
      - id: construcao/tecnicas
        names: {pt: Técnicas de construção, en: Building techniques}
        slugs: {pt: tecnicas, en: techniques}
        descriptions:
          pt: >-
            Técnicas de construção: fundações, paredes, telhados, estruturas, alvenaria,
            carpintaria, autoconstrução, abrigos, cabanas, projeto, plantas e medições de obra.
          en: >-
            Building techniques: foundations, walls, roofs, framing, masonry, carpentry,
            self-build, shelters, cabins, design, plans and site measurements.
      - id: construcao/isolamento
        names: {pt: Isolamento e climatização, en: Insulation and climate control}
        slugs: {pt: isolamento, en: insulation}
        descriptions:
          pt: >-
            Isolamento e climatização: isolamento térmico, aquecimento, arrefecimento, ventilação,
            humidade, janelas, lareiras, bombas de calor, conforto térmico e poupança de energia.
          en: >-
            Insulation and climate control: thermal insulation, heating, cooling, ventilation,
            damp, windows, fireplaces, heat pumps, thermal comfort and energy saving.
      - id: construcao/reparacoes
        names: {pt: Reparações domésticas, en: Home repairs}
        slugs: {pt: reparacoes, en: repairs}
        descriptions:
          pt: >-
            Reparações domésticas e bricolage: canalização, torneiras, pintura, pavimentos,
            azulejos, portas, fechaduras, tomadas e interruptores, humidade em paredes e obras
            faça-você-mesmo.
          en: >-
            Home repairs and DIY: plumbing, taps, painting, flooring, tiles, doors, locks, sockets
            and switches, damp walls and do-it-yourself renovation.

