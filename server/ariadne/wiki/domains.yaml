  # --- água e saneamento ---------------------------------------------------------------------
  - id: agua
    names: {pt: Água e saneamento, en: Water and sanitation}
    slugs: {pt: agua-e-saneamento, en: water-and-sanitation}
    descriptions:
      pt: >-
        Água potável e saneamento: obter, tratar e distribuir água e tratar as águas usadas e os
        dejetos.
      en: >-
        Drinking water and sanitation: obtaining, treating and distributing water and handling
        wastewater and human waste.
    children:
      - id: agua/tratamento
        names: {pt: Tratamento de água, en: Water treatment}
        slugs: {pt: tratamento, en: treatment}
        descriptions:
          pt: >-
            Tratamento e purificação de água: filtros, desinfeção com cloro, fervura, desinfeção
            solar, sedimentação, carvão ativado, turbidez, água potável segura e análises.
          en: >-
            Water treatment and purification: filters, chlorine disinfection, boiling, solar
            disinfection, sedimentation, activated carbon, turbidity, safe drinking water and
            testing.
      - id: agua/abastecimento
        names: {pt: Abastecimento de água, en: Water supply}
        slugs: {pt: abastecimento, en: supply}
        descriptions:
          pt: >-
            Abastecimento de água: poços, furos, nascentes, bombas manuais, cisternas, captação da
            chuva, reservatórios, canalização, rega e distribuição de água a uma comunidade.
          en: >-
            Water supply: wells, boreholes, springs, hand pumps, cisterns, rainwater harvesting,
            reservoirs, piping, irrigation and distributing water to a community.
      - id: agua/saneamento
        names: {pt: Saneamento, en: Sanitation}
        slugs: {pt: saneamento, en: sanitation}
        descriptions:
          pt: >-
            Saneamento básico: latrinas, fossas sépticas, esgotos, águas residuais, retretes
            secas, tratamento de dejetos, lagunagem, higiene das mãos e lixo.
          en: >-
            Basic sanitation: latrines, septic tanks, sewers, wastewater, dry toilets, excreta
            treatment, lagoons, handwashing and waste disposal.

