# A árvore de domínios do Wiki.js (docs/WIKI-IMPORT.md, secção 6).
#
# Cada nó tem `id` (estável: é a chave na base de dados; o caminho da página usa os `slugs`),
# `names`, `slugs` e `descriptions` em `pt` e `en`, e opcionalmente `children`. A descrição vai
# para os vetores (e5, «passage:»): 1 a 2 frases cheias dos termos que o domínio cobre, escritas
# como se fossem o início de um artigo desse domínio. Os `slugs` são únicos entre irmãos.
# O nó `por-classificar` é especial: onde fica o que ainda não foi colocado; não tem vetor.
#
# `source_priors` fixa o domínio de fontes especializadas pelo nome do ZIM (maiúsculas ignoradas).
# Um padrão sem `*` é um prefixo do nome; com `*` é um padrão de ficheiros (fnmatch). Se o domínio
# do prior não é uma folha, os vetores escolhem a folha dentro dele.
#
# Editar este ficheiro e correr `domains.sync_tree` actualiza a tabela `domain`: os nós que saem
# ficam inativos (não se apagam, as colocações antigas continuam a apontar para eles).

version: 1

domains:
  # --- saúde ---------------------------------------------------------------------------------
  - id: saude
    names: {pt: Saúde, en: Health}
    slugs: {pt: saude, en: health}
    descriptions:
      pt: >-
        Saúde humana: medicina, doenças, tratamentos, medicamentos, primeiros socorros, nutrição,
        saúde mental, gravidez e cuidados de saúde, para diagnosticar, tratar e prevenir.
      en: >-
        Human health: medicine, diseases, treatments, drugs, first aid, nutrition, mental health,
        pregnancy and healthcare, to diagnose, treat and prevent illness.
    children:
      - id: saude/medicamentos
        names: {pt: Medicamentos, en: Medicines}
        slugs: {pt: medicamentos, en: medicines}
        descriptions:
          pt: >-
            Medicamentos e fármacos: para que serve, dose, efeitos secundários, interações,
            contraindicações, quem pode ou não tomar, analgésicos, antibióticos, anti-inflamatórios
            e insulina.
          en: >-
            Medicines and drugs: what it is used for, dose, side effects, interactions,
            contraindications, who can and cannot take it, painkillers, antibiotics,
            anti-inflammatories and insulin.
      - id: saude/doencas
        names: {pt: Doenças e condições, en: Diseases and conditions}
        slugs: {pt: doencas, en: diseases}
        descriptions:
          pt: >-
            Doenças e condições clínicas: sintomas, causas, diagnóstico, tratamento e prognóstico
            de infeções, doenças crónicas, genéticas e do coração, cancro, diabetes e alergias.
          en: >-
            Diseases and medical conditions: symptoms, causes, diagnosis, treatment and prognosis
            of infections, chronic and genetic disorders, heart disease, cancer, diabetes and
            allergies.
      - id: saude/primeiros-socorros
        names: {pt: Primeiros socorros e emergência, en: First aid and emergency}
        slugs: {pt: primeiros-socorros, en: first-aid}
        descriptions:
          pt: >-
            Primeiros socorros e medicina de emergência: reanimação, hemorragia, queimaduras,
            fraturas, envenenamento, trauma, choque, vias aéreas e triagem no atendimento urgente.
          en: >-
            First aid and emergency medicine: resuscitation, bleeding, burns, fractures,
            poisoning, trauma, shock, airway management and triage in urgent care.
      - id: saude/nutricao
        names: {pt: Nutrição, en: Nutrition}
        slugs: {pt: nutricao, en: nutrition}
        descriptions:
          pt: >-
            Nutrição e dieta: calorias, proteínas, vitaminas, minerais, hidratos de carbono,
            gorduras, alimentação saudável, obesidade, desnutrição e suplementos alimentares.
          en: >-
            Nutrition and diet: calories, proteins, vitamins, minerals, carbohydrates, fats,
            healthy eating, obesity, malnutrition and dietary supplements.
      - id: saude/saude-mental
        names: {pt: Saúde mental, en: Mental health}
        slugs: {pt: saude-mental, en: mental-health}
        descriptions:
          pt: >-
            Saúde mental e psicologia: depressão, ansiedade, stress, perturbações do humor e do
            sono, psicoterapia, comportamento, dependências e bem-estar emocional.
          en: >-
            Mental health and psychology: depression, anxiety, stress, mood and sleep disorders,
            psychotherapy, behaviour, addiction and emotional wellbeing.
      - id: saude/saude-reprodutiva
        names: {pt: Saúde reprodutiva, en: Reproductive health}
        slugs: {pt: saude-reprodutiva, en: reproductive-health}
        descriptions:
          pt: >-
            Saúde reprodutiva e sexual: contraceção, gravidez, parto, amamentação, fertilidade,
            menstruação, menopausa, infeções sexualmente transmissíveis e planeamento familiar.
          en: >-
            Reproductive and sexual health: contraception, pregnancy, childbirth, breastfeeding,
            fertility, menstruation, menopause, sexually transmitted infections and family
            planning.
      - id: saude/corpo-humano
        names: {pt: Corpo humano, en: Human body}
        slugs: {pt: corpo-humano, en: human-body}
        descriptions:
          pt: >-
            Anatomia e fisiologia do corpo humano: órgãos, músculos, ossos, nervos, sistema
            circulatório, respiratório e digestivo, células, hormonas e o funcionamento do corpo.
          en: >-
            Human anatomy and physiology: organs, muscles, bones, nerves, circulatory,
            respiratory and digestive systems, cells, hormones and how the body works.
      - id: saude/saude-publica
        names: {pt: Saúde pública, en: Public health}
        slugs: {pt: saude-publica, en: public-health}
        descriptions:
          pt: >-
            Saúde pública: epidemiologia, vacinação, higiene, prevenção de doenças, surtos e
            pandemias, serviços de saúde, rastreios e políticas de saúde de uma população.
          en: >-
            Public health: epidemiology, vaccination, hygiene, disease prevention, outbreaks and
            pandemics, health services, screening and population health policy.

  # --- alimentação ---------------------------------------------------------------------------
  - id: alimentacao
    names: {pt: Alimentação, en: Food}
    slugs: {pt: alimentacao, en: food}
    descriptions:
      pt: >-
        Alimentação e cozinha: receitas, ingredientes, técnicas culinárias e a conservação dos
        alimentos para guardar comida em casa.
      en: >-
        Food and cooking: recipes, ingredients, culinary techniques and food preservation to
        store food at home.
    children:
      - id: alimentacao/receitas
        names: {pt: Receitas, en: Recipes}
        slugs: {pt: receitas, en: recipes}
        descriptions:
          pt: >-
            Receitas de cozinha: ingredientes, quantidades, modo de preparação, forno, fritar,
            cozer, assar, massas, pão, bolos, sobremesas, molhos, carne, peixe e legumes.
          en: >-
            Cooking recipes: ingredients, quantities, preparation method, oven, frying, boiling,
            baking, pasta, bread, cakes, desserts, sauces, meat, fish and vegetables.
      - id: alimentacao/conservacao
        names: {pt: Conservação de alimentos, en: Food preservation}
        slugs: {pt: conservacao, en: preservation}
        descriptions:
          pt: >-
            Conservação de alimentos: conservas, secagem, desidratação, fumeiro, salga, curtimenta,
            fermentação, congelação, esterilização em frascos, armazenamento e segurança alimentar.
          en: >-
            Food preservation: canning, drying, dehydration, smoking, salting, pickling,
            fermentation, freezing, sterilising in jars, storage and food safety.

  # --- agricultura ---------------------------------------------------------------------------
  - id: agricultura
    names: {pt: Agricultura, en: Agriculture}
    slugs: {pt: agricultura, en: agriculture}
    descriptions:
      pt: >-
        Agricultura e vida rural: cultivar a terra, solos, hortas, culturas, pragas, animais de
        criação, abelhas e floresta.
      en: >-
        Agriculture and rural life: farming the land, soils, gardens, crops, pests, livestock,
        bees and forestry.
    children:
      - id: agricultura/solos-e-compostagem
        names: {pt: Solos e compostagem, en: Soils and composting}
        slugs: {pt: solos-e-compostagem, en: soils-and-composting}
        descriptions:
          pt: >-
            Solos e compostagem: fertilidade, húmus, adubos, estrume, composto, minhocas,
            correção do pH, erosão, rega e rotação de culturas para melhorar a terra.
          en: >-
            Soils and composting: fertility, humus, fertilisers, manure, compost, worms, pH
            correction, erosion, irrigation and crop rotation to improve the land.
      - id: agricultura/culturas
        names: {pt: Culturas e horta, en: Crops and gardening}
        slugs: {pt: culturas, en: crops}
        descriptions:
          pt: >-
            Culturas agrícolas e horta: sementeira, plantação, colheita, cereais, batata, feijão,
            hortaliças, árvores de fruto, estufas, jardinagem e calendário agrícola.
          en: >-
            Crops and vegetable gardening: sowing, planting, harvest, cereals, potatoes, beans,
            vegetables, fruit trees, greenhouses, gardening and planting calendar.
      - id: agricultura/pragas
        names: {pt: Pragas e doenças das plantas, en: Pests and plant diseases}
        slugs: {pt: pragas, en: pests}
        descriptions:
          pt: >-
            Pragas e doenças das plantas: insetos, fungos, ervas daninhas, roedores, pesticidas,
            controlo biológico, armadilhas e proteção das culturas e do armazém de grãos.
          en: >-
            Pests and plant diseases: insects, fungi, weeds, rodents, pesticides, biological
            control, traps and protection of crops and grain stores.
      - id: agricultura/pecuaria
        names: {pt: Pecuária, en: Livestock}
        slugs: {pt: pecuaria, en: livestock}
        descriptions:
          pt: >-
            Pecuária e animais de criação: gado, vacas, ovelhas, cabras, porcos, galinhas, coelhos,
            ração, leite, ovos, abate, veterinária e doenças dos animais.
          en: >-
            Livestock and farm animals: cattle, cows, sheep, goats, pigs, chickens, rabbits, feed,
            milk, eggs, slaughter, veterinary care and animal diseases.
      - id: agricultura/apicultura
        names: {pt: Apicultura, en: Beekeeping}
        slugs: {pt: apicultura, en: beekeeping}
        descriptions:
          pt: >-
            Apicultura, a criação de abelhas: colmeias, apiário, enxames, abelha-rainha, zângãos,
            varroa, extração do mel, cera e polinização pelas abelhas melíferas.
          en: >-
            Beekeeping, the rearing of honey bees: hives, apiary, swarms, queen bee, drones, varroa
            mites, honey extraction, beeswax and pollination by honeybees.
      - id: agricultura/silvicultura
        names: {pt: Silvicultura, en: Forestry}
        slugs: {pt: silvicultura, en: forestry}
        descriptions:
          pt: >-
            Silvicultura e floresta: árvores, madeira, lenha, reflorestação, gestão florestal,
            incêndios florestais, cortiça, resina e agrossilvicultura.
          en: >-
            Forestry and woodland: trees, timber, firewood, reforestation, forest management,
