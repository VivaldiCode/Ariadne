          en: >-
            Grammar and language learning: spelling, syntax, verbs, vocabulary, phonetics,
            linguistics, writing, translation, alphabets and how to learn a language.
      - id: linguas/obras
        names: {pt: Obras literárias, en: Literary works}
        slugs: {pt: obras, en: works}
        descriptions:
          pt: >-
            Obras literárias: romances, contos, poesia, teatro, ensaios, capítulos de livros
            clássicos, personagens, enredo, autores, crítica literária e textos de domínio público.
          en: >-
            Literary works: novels, short stories, poetry, drama, essays, chapters of classic
            books, characters, plot, authors, literary criticism and public domain texts.

  # --- artes e música ------------------------------------------------------------------------
  - id: artes
    names: {pt: Artes e música, en: Arts and music}
    slugs: {pt: artes, en: arts}
    descriptions:
      pt: >-
        Artes e música: criação artística, música, pintura, cinema, ofícios e artesanato.
      en: >-
        Arts and music: artistic creation, music, painting, film, crafts and handicrafts.
    children:
      - id: artes/musica
        names: {pt: Música, en: Music}
        slugs: {pt: musica, en: music}
        descriptions:
          pt: >-
            Música: compositores, obras, sinfonias, quartetos, instrumentos, notas, harmonia,
            teoria musical, canções, álbuns, bandas, géneros e concertos.
          en: >-
            Music: composers, works, symphonies, quartets, instruments, notes, harmony, music
            theory, songs, albums, bands, genres and concerts.
      - id: artes/artes-visuais
        names: {pt: Artes visuais, en: Visual arts}
        slugs: {pt: artes-visuais, en: visual-arts}
        descriptions:
          pt: >-
            Artes visuais: pintura, escultura, desenho, fotografia, arquitetura, design, museus,
            movimentos artísticos e história da arte.
          en: >-
            Visual arts: painting, sculpture, drawing, photography, architecture, design, museums,
            art movements and art history.
      - id: artes/cinema
        names: {pt: Cinema, teatro e televisão, en: Film, theatre and television}
        slugs: {pt: cinema, en: film}
        descriptions:
          pt: >-
            Cinema, teatro e televisão: filmes, séries, realizadores, atores, elenco, enredo,
            canais de televisão, programas, estreias, prémios e espetáculos.
          en: >-
            Film, theatre and television: movies, series, directors, actors, cast, plot,
            television channels, programmes, premieres, awards and performances.
      - id: artes/artesanato
        names: {pt: Artesanato, en: Crafts}
        slugs: {pt: artesanato, en: crafts}
        descriptions:
          pt: >-
            Artesanato e ofícios: costura, tricô, tecelagem, cerâmica, olaria, cestaria, couro,
            vime, sabão, velas, tinturaria e trabalhos manuais tradicionais.
          en: >-
            Handicrafts and trades: sewing, knitting, weaving, ceramics, pottery, basketry,
            leather, wicker, soap, candles, dyeing and traditional handwork.

  # --- educação ------------------------------------------------------------------------------
  - id: educacao
    names: {pt: Educação, en: Education}
    slugs: {pt: educacao, en: education}
    descriptions:
      pt: >-
        Educação: ensinar e aprender, com métodos de ensino e cursos e exercícios.
      en: >-
        Education: teaching and learning, with teaching methods, courses and exercises.
    children:
      - id: educacao/ensino
        names: {pt: Ensino e pedagogia, en: Teaching and pedagogy}
        slugs: {pt: ensino, en: teaching}
        descriptions:
          pt: >-
            Ensino e pedagogia: métodos de ensino, plano de aula, professores, avaliação,
            currículo, escolas, aprendizagem das crianças, educação de adultos e alfabetização.
          en: >-
            Teaching and pedagogy: teaching methods, lesson plans, teachers, assessment,
            curriculum, schools, children's learning, adult education and literacy.
      - id: educacao/cursos
        names: {pt: Cursos e exercícios, en: Courses and exercises}
        slugs: {pt: cursos, en: courses}
        descriptions:
          pt: >-
            Cursos e exercícios: lições, módulos, problemas resolvidos, desafios de código, vídeos
            de aulas, exercícios de matemática, tutoriais passo a passo e testes de revisão.
          en: >-
            Courses and exercises: lessons, modules, worked problems, coding challenges, lecture
            videos, maths exercises, step-by-step tutorials and review quizzes.

  # --- desporto e lazer ----------------------------------------------------------------------
  - id: desporto
    names: {pt: Desporto e lazer, en: Sport and leisure}
    slugs: {pt: desporto-e-lazer, en: sport-and-leisure}
    descriptions:
      pt: >-
        Desporto e lazer: exercício, modalidades desportivas, jogos e passatempos.
      en: >-
        Sport and leisure: exercise, sports, games and hobbies.
    children:
      - id: desporto/exercicio
        names: {pt: Exercício físico, en: Physical exercise}
        slugs: {pt: exercicio, en: exercise}
        descriptions:
          pt: >-
            Exercício físico: treino, corrida, musculação, alongamentos, condição física,
            ioga, resistência, lesões desportivas, aquecimento e planos de treino.
          en: >-
            Physical exercise: training, running, strength training, stretching, fitness, yoga,
            endurance, sports injuries, warm-up and training plans.
      - id: desporto/modalidades
        names: {pt: Modalidades e competições, en: Sports and competitions}
        slugs: {pt: modalidades, en: sports}
        descriptions:
          pt: >-
            Modalidades desportivas e competições: futebol, ténis, natação, atletismo, equipas,
            campeonatos, jogadores, regras, resultados, clubes e Jogos Olímpicos.
          en: >-
            Sports and competitions: football, tennis, swimming, athletics, teams, championships,
            players, rules, results, clubs and the Olympic Games.
      - id: desporto/passatempos
        names: {pt: Jogos e passatempos, en: Games and hobbies}
        slugs: {pt: passatempos, en: hobbies}
        descriptions:
          pt: >-
            Jogos e passatempos: jogos de tabuleiro e de cartas, xadrez, videojogos, quebra-cabeças,
            campismo, pesca desportiva, colecionismo, animais de estimação e tempo livre.
          en: >-
            Games and hobbies: board and card games, chess, video games, puzzles, camping, sport
            fishing, collecting, pets and free time.

  # --- biografias ----------------------------------------------------------------------------
  - id: biografias
    names: {pt: Biografias, en: Biographies}
    slugs: {pt: biografias, en: biographies}
    descriptions:
      pt: >-
        Biografias: a vida de pessoas, onde e quando nasceram, a carreira e o que fizeram.
      en: >-
        Biographies: the lives of people, where and when they were born, their careers and what
        they did.
    children:
      - id: biografias/ciencia-e-tecnologia
        names: {pt: Cientistas e inventores, en: Scientists and inventors}
        slugs: {pt: ciencia-e-tecnologia, en: science-and-technology}
        descriptions:
          pt: >-
            Biografia de um cientista, médico, matemático, engenheiro ou inventor: nasceu, estudou,
            descobertas, invenções, prémios e morreu.
          en: >-
            Biography of a scientist, physician, mathematician, engineer or inventor: born,
            studied, discoveries, inventions, awards and died.
      - id: biografias/artes-e-letras
        names: {pt: Artistas e escritores, en: Artists and writers}
        slugs: {pt: artes-e-letras, en: arts-and-letters}
        descriptions:
          pt: >-
            Biografia de um artista, músico, ator, escritor ou poeta: nasceu, formação, obras mais
            conhecidas, carreira, prémios e vida pessoal.
          en: >-
            Biography of an artist, musician, actor, writer or poet: born, training, best-known
            works, career, awards and personal life.
      - id: biografias/politica-e-guerra
        names: {pt: Políticos e militares, en: Politicians and military figures}
        slugs: {pt: politica-e-guerra, en: politics-and-war}
        descriptions:
          pt: >-
            Biografia de um político, governante, militar, rei ou ativista: nasceu, cargos,
            mandato, batalhas, partido, reformas e morte.
          en: >-
            Biography of a politician, ruler, soldier, king or activist: born, offices, term in
            power, battles, party, reforms and death.
      - id: biografias/outras
        names: {pt: Outras pessoas, en: Other people}
        slugs: {pt: outras, en: others}
        descriptions:
          pt: >-
            Biografia de uma pessoa: desportistas, empresários, exploradores, religiosos e outras
            personalidades; nasceu em, carreira, feitos e vida.
          en: >-
            Biography of a person: athletes, businesspeople, explorers, religious figures and
            other public figures; born in, career, achievements and life.

