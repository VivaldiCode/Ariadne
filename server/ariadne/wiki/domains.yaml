  # --- ciências ------------------------------------------------------------------------------
  - id: ciencias
    names: {pt: Ciências, en: Sciences}
    slugs: {pt: ciencias, en: sciences}
    descriptions:
      pt: >-
        Ciências da natureza: física, química, biologia, astronomia, geologia e ambiente, para
        compreender o mundo natural.
      en: >-
        Natural sciences: physics, chemistry, biology, astronomy, geology and environment, to
        understand the natural world.
    children:
      - id: ciencias/fisica
        names: {pt: Física, en: Physics}
        slugs: {pt: fisica, en: physics}
        descriptions:
          pt: >-
            Física: mecânica, movimento, força, energia, calor, termodinâmica, ondas, luz, óptica,
            eletromagnetismo, relatividade e física quântica, partículas e átomos.
          en: >-
            Physics: mechanics, motion, force, energy, heat, thermodynamics, waves, light, optics,
            electromagnetism, relativity and quantum physics, particles and atoms.
      - id: ciencias/quimica
        names: {pt: Química, en: Chemistry}
        slugs: {pt: quimica, en: chemistry}
        descriptions:
          pt: >-
            Química: elementos, tabela periódica, átomos, moléculas, ligações, reações, ácidos e
            bases, soluções, compostos orgânicos, materiais e experiências de laboratório.
          en: >-
            Chemistry: elements, periodic table, atoms, molecules, bonds, reactions, acids and
            bases, solutions, organic compounds, materials and laboratory experiments.
      - id: ciencias/biologia
        names: {pt: Biologia, en: Biology}
        slugs: {pt: biologia, en: biology}
        descriptions:
          pt: >-
            Biologia: células, genética, ADN, evolução, espécies, taxonomia, plantas, animais,
            insetos, aves, fungos, bactérias, vírus, microbiologia e ecologia.
          en: >-
            Biology: cells, genetics, DNA, evolution, species, taxonomy, plants, animals, insects,
            birds, fungi, bacteria, viruses, microbiology and ecology.
      - id: ciencias/astronomia
        names: {pt: Astronomia, en: Astronomy}
        slugs: {pt: astronomia, en: astronomy}
        descriptions:
          pt: >-
            Astronomia: estrelas, planetas, sistema solar, galáxias, luas, cometas, buracos negros,
            telescópios, cosmologia, órbitas, exploração espacial e o universo.
          en: >-
            Astronomy: stars, planets, solar system, galaxies, moons, comets, black holes,
            telescopes, cosmology, orbits, space exploration and the universe.
      - id: ciencias/geologia
        names: {pt: Geologia, en: Geology}
        slugs: {pt: geologia, en: geology}
        descriptions:
          pt: >-
            Geologia: rochas, minerais, fósseis, vulcões, sismos, placas tectónicas, solos,
            cavernas, relevo, erosão, clima, meteorologia e a história da Terra.
          en: >-
            Geology: rocks, minerals, fossils, volcanoes, earthquakes, tectonic plates, soils,
            caves, landforms, erosion, climate, meteorology and Earth history.
      - id: ciencias/ambiente
        names: {pt: Ambiente e ecologia, en: Environment and ecology}
        slugs: {pt: ambiente, en: environment}
        descriptions:
          pt: >-
            Ambiente e ecologia: ecossistemas, biodiversidade, poluição, alterações climáticas,
            reciclagem, resíduos, conservação da natureza, desenvolvimento sustentável e recursos
            naturais.
          en: >-
            Environment and ecology: ecosystems, biodiversity, pollution, climate change,
            recycling, waste, nature conservation, sustainable development and natural resources.

