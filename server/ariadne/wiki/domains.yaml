      - id: transportes/estradas
        names: {pt: Estradas e pontes, en: Roads and bridges}
        slugs: {pt: estradas, en: roads}
        descriptions:
          pt: >-
            Estradas e pontes: construção de caminhos, pavimentos, drenagem, pontes, travessias de
