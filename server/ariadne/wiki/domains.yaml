      - id: energia/eolica
        names: {pt: Energia eólica, en: Wind energy}
        slugs: {pt: eolica, en: wind}
        descriptions:
          pt: >-
            Energia eólica: aerogeradores, turbinas de vento, pás, torres, moinhos de vento,
            bombas eólicas, velocidade do vento e geradores de baixa potência.
          en: >-
            Wind energy: wind turbines, blades, towers, windmills, wind pumps, wind speed and
            small-scale generators.
      - id: energia/hidrica
        names: {pt: Energia hídrica, en: Hydropower}
        slugs: {pt: hidrica, en: hydropower}
        descriptions:
          pt: >-
            Energia hídrica: minihídricas, rodas de água, turbinas, açudes, queda de água, caudal,
            barragens, bombas de aríete hidráulico e produção de eletricidade com rios.
          en: >-
            Hydropower: micro-hydro, water wheels, turbines, weirs, head, flow rate, dams,
            hydraulic ram pumps and generating electricity from rivers.
      - id: energia/biomassa
        names: {pt: Biomassa e combustíveis, en: Biomass and fuels}
        slugs: {pt: biomassa, en: biomass}
        descriptions:
          pt: >-
            Biomassa e combustíveis: lenha, carvão vegetal, biogás, biodigestores, biodiesel,
            etanol, pellets, fogões eficientes, fogões de lenha e gasogénios.
          en: >-
            Biomass and fuels: firewood, charcoal, biogas, digesters, biodiesel, ethanol, pellets,
            efficient stoves, wood stoves and gasifiers.
      - id: energia/eletricidade
        names: {pt: Eletricidade, en: Electricity}
        slugs: {pt: eletricidade, en: electricity}
        descriptions:
          pt: >-
            Eletricidade: tensão, corrente, potência, circuitos, instalação elétrica, cabos,
            quadros, geradores, baterias, acumuladores, transformadores e segurança elétrica.
          en: >-
            Electricity: voltage, current, power, circuits, electrical wiring, cables, panels,
            generators, batteries, accumulators, transformers and electrical safety.

