  # --- sobrevivência e preparação ------------------------------------------------------------
  - id: sobrevivencia
    names: {pt: Sobrevivência e preparação, en: Survival and preparedness}
    slugs: {pt: sobrevivencia, en: survival}
    descriptions:
      pt: >-
        Sobrevivência e preparação para emergências: aguentar catástrofes, ficar sem
        eletricidade ou sem apoio e saber desenrascar-se em ambientes selvagens.
      en: >-
        Survival and emergency preparedness: coping with disasters, power cuts or no outside help
        and getting by in the wilderness.
    children:
      - id: sobrevivencia/equipamento
        names: {pt: Equipamento, en: Gear}
        slugs: {pt: equipamento, en: gear}
        descriptions:
          pt: >-
            Equipamento de sobrevivência e acampamento: facas de mato, machados, mochilas, kits de
            emergência, lanternas, espelhos de sinalização, sacos-cama, tendas e fogareiros, e
            avaliação de produtos.
          en: >-
            Survival and camping gear: bushcraft knives, axes, backpacks, emergency kits,
            flashlights, signal mirrors, sleeping bags, tents and camp stoves, and product
            reviews.
      - id: sobrevivencia/abrigo-e-fogo
        names: {pt: Abrigo e fogo, en: Shelter and fire}
        slugs: {pt: abrigo-e-fogo, en: shelter-and-fire}
        descriptions:
          pt: >-
            Fazer fogo e construir um abrigo improvisado na natureza para sobreviver ao frio:
            fogueira, acendalhas, pederneira, lume, cabana de ramos, lona, hipotermia e perder-se
            no mato.
          en: >-
            Making fire and building an improvised shelter in the wilderness to survive the cold:
            campfire, tinder, flint, lean-to of branches, tarp, hypothermia and being lost in the
            woods.
      - id: sobrevivencia/emergencias
        names: {pt: Emergências e catástrofes, en: Emergencies and disasters}
        slugs: {pt: emergencias, en: emergencies}
        descriptions:
          pt: >-
            Preparação para emergências e catástrofes: planos, reservas de comida e água, apagões,
            sismos, inundações, tempestades, evacuação, comunicações de emergência e comunidade.
          en: >-
            Preparing for emergencies and disasters: plans, food and water stockpiles, blackouts,
            earthquakes, floods, storms, evacuation, emergency communications and community.
      - id: sobrevivencia/alimento-selvagem
        names: {pt: Alimento selvagem, en: Wild food}
        slugs: {pt: alimento-selvagem, en: wild-food}
        descriptions:
          pt: >-
            Alimento selvagem: recoleção de plantas comestíveis, cogumelos, caça, armadilhas,
            pesca, aves, peixe, limpar e preparar animais e identificar plantas venenosas.
          en: >-
            Wild food: foraging edible plants, mushrooms, hunting, traps, fishing, birds, fish,
            cleaning and preparing game and identifying poisonous plants.

