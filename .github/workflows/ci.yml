name: CI

# Runs on the maintainer's own CI runner (GitHub Actions is turned off for this repository). Web (types, tests, build) and
# server (ruff, mypy, pytest). The tests that need the other Compose
# services (kiwix, Moodle, Jobe, Calibre, Kavita) or download a model are deselected here; the rest
# run against a real Postgres with pgvector, in temporary databases.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run at a time: the jobs share the runner host (host networking), so the Postgres service port
# must not be taken twice.
concurrency:
  group: ariadne-ci
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: ariadne
          POSTGRES_PASSWORD: ci-only-password
          # The runner uses host networking: the service listens on the host, on a port nobody else uses.
          PGPORT: "55432"
        options: >-
          --health-cmd "pg_isready -U ariadne -p 55432"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ariadne:ci-only-password@localhost:55432/postgres
      EMBEDDER: fake
      # The runner workspace sits on a network file system that refuses the clones and hard links uv makes by default
      # ("Resource temporarily unavailable"): copy the files and keep the cache inside the container.
      UV_LINK_MODE: copy
      UV_CACHE_DIR: /tmp/uv-cache
      UV_CONCURRENT_INSTALLS: "1"
    steps:
      - uses: actions/checkout@v4
      # Only the actions mirrored on the maintainer's own CI server are available (checkout, setup-node, upload/download-artifact):
      # uv comes from PyPI.
      - name: Install uv
        run: python3 -m pip install --break-system-packages --quiet uv
      # A few tests need the age, ssh-keygen and psql binaries and pg_dump 17 (they skip themselves when these are missing;
      # pg_dump refuses a server newer than itself, so the client comes from the PostgreSQL apt repository).
      - name: Install age, ssh-keygen and the PostgreSQL 17 client
        run: |
          apt-get update -qq && apt-get install -y -qq age openssh-client curl ca-certificates || exit 0
          install -d /usr/share/postgresql-common/pgdg
          curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc || exit 0
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" > /etc/apt/sources.list.d/pgdg.list
          apt-get update -qq && apt-get install -y -qq postgresql-client-17 || true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q -m "not kiwix and not jobe and not moodle and not calibre and not kavita and not wikijs and not mempalace and not model"
