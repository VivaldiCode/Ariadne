name: CI

# Web (types, tests, build) and server (ruff, mypy, pytest). The tests that need the other Compose
# services (kiwix, Moodle, Jobe, Calibre, Kavita) or download a model are deselected here; the rest
# run against a real Postgres with pgvector, in temporary databases.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: ariadne
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ariadne"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_PORT: "5432"
      EMBEDDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q -m "not kiwix and not jobe and not moodle and not calibre and not kavita and not wikijs and not mempalace and not model"
