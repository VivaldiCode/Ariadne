name: Images

# Builds the standalone compose images and pushes them to Docker Hub. Runs on the maintainer's own CI runner
# (GitHub Actions is turned off for this repository), on a version tag (v*) or by hand. Repository settings:
#   vars.IMAGE_REGISTRY         registry host (default: docker.io)
#   vars.IMAGE_NAMESPACE        Docker Hub user or organization that owns the images (required to push)
#   secrets.DOCKERHUB_USERNAME  Docker Hub user the token belongs to
#   secrets.DOCKERHUB_TOKEN     Docker Hub access token with Read & Write permission only
# Not yet run on the runner.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Empty = the ref name."
        required: false
      publicar:
        description: "Push to the registry (false = build only)"
        type: boolean
        default: false

env:
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'docker.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}

jobs:
  imagens:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # amd64 only: the target is an x86-64 CPU without AVX (nothing here is built with -march=native). arm64 would
        # need QEMU registered on the runner host, which this CI does not do; the Calibre binary and the Jobe base
        # image are x86-64 only anyway.
        include:
          - { nome: ariadne-server,  contexto: ".",            dockerfile: server/Dockerfile,         plataformas: "linux/amd64" }
          - { nome: ariadne-moodle,  contexto: deploy/moodle,  dockerfile: deploy/moodle/Dockerfile,  plataformas: "linux/amd64" }
          - { nome: ariadne-kiwix,   contexto: deploy,         dockerfile: deploy/kiwix/Dockerfile,   plataformas: "linux/amd64" }
          - { nome: ariadne-calibre, contexto: deploy/calibre, dockerfile: deploy/calibre/Dockerfile, plataformas: "linux/amd64" }
          - { nome: ariadne-jobe,    contexto: deploy/jobe,    dockerfile: deploy/jobe/Dockerfile,    plataformas: "linux/amd64" }
          - { nome: ariadne-curator, contexto: deploy/curator, dockerfile: deploy/curator/Dockerfile, plataformas: "linux/amd64" }
    steps:
      - uses: actions/checkout@v4

      - name: Is there a Dockerfile?
        id: existe
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then echo "sim=true" >> "$GITHUB_OUTPUT"; else echo "sim=false" >> "$GITHUB_OUTPUT"; fi

      - name: Tags
        if: steps.existe.outputs.sim == 'true'
        id: tags
        run: |
          set -e
          publicar="${{ (github.event_name == 'push' || inputs.publicar) && 'sim' || 'nao' }}"
          if [ "$publicar" = sim ] && [ -z "${IMAGE_NAMESPACE}" ]; then
            echo "::error::Set vars.IMAGE_NAMESPACE (the Docker Hub user or organization) before pushing."; exit 1
          fi
          # The registry and the image name in lowercase (registries refuse uppercase).
          imagem=$(echo "${IMAGE_REGISTRY}/${IMAGE_NAMESPACE:-local}/${{ matrix.nome }}" | tr '[:upper:]' '[:lower:]')
          versao="${{ inputs.tag || github.ref_name }}"
          tags="${imagem}:${versao}"
          case "$versao" in v[0-9]*) tags="${tags},${imagem}:latest" ;; esac
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "publicar=${publicar}" >> "$GITHUB_OUTPUT"

      # Plain docker CLI: the runner's daemon is used directly and only the actions mirrored on the maintainer's own CI server
      # exist (no docker/* actions).
      - name: Log in to Docker Hub
        if: steps.existe.outputs.sim == 'true' && steps.tags.outputs.publicar == 'sim'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login "$IMAGE_REGISTRY" -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build
        if: steps.existe.outputs.sim == 'true'
        run: |
          set -e
          args=""
          for t in $(echo "${{ steps.tags.outputs.tags }}" | tr ',' ' '); do args="$args -t $t"; done
          docker build --platform "${{ matrix.plataformas }}" -f "${{ matrix.dockerfile }}" $args \
            --label org.opencontainers.image.source=https://github.com/VivaldiCode/Ariadne \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.licenses=AGPL-3.0-only \
            "${{ matrix.contexto }}"

      - name: Push
        if: steps.existe.outputs.sim == 'true' && steps.tags.outputs.publicar == 'sim'
        run: |
          set -e
          for t in $(echo "${{ steps.tags.outputs.tags }}" | tr ',' ' '); do docker push "$t"; done
